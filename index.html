<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Project</title>
    <style>
        /* CSS Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebe1 0%, #d4a5ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #6c5ce7;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2d3436;
        }

        p {
            color: #636e72;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #5143d9;
        }
    </style>
</head>
<body>

    <!-- HTML Structure -->
    <div class="card">
        <div class="profile-img">V</div>
        <h1>Hello, I'm a Developer</h1>
        <p>This is my very first GitHub repository web page. Built using HTML and CSS, this marks the official beginning of my coding journey!</p>
        <a href="#" class="btn">Connect With Me</a>
    </div>

</body>
</html>
